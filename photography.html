<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta tags -->
    <title>Simone Carletti - Computer Engineer</title>
    <meta name="title" content="Simone Carletti - Computer Engineer" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="./assets/images/favicon.png" type="image/png" />

    <!-- Gogle font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet" />

    <!-- Include Handlebars -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
    <script src="./assets/js/handlebar-init.js"></script>
    <script src="./assets/js/main.js"></script>
    <script src="./assets/js/context.js"></script>

    <!-- Custom css link -->
    <link rel="stylesheet" href="./assets/css/require.css" />
    <link rel="stylesheet" href="./assets/css/main.css" />

    <style>
      .photography {
        padding-block-start: calc(var(--section-padding) + 60px);
      }

      .header,
      main {
        background-color: var(--black) !important;
        color: var(--white) !important;
      }

      .header.active {
        box-shadow: 0 2px 2px hsla(0, 0%, 90%, 0.1);
      }

      .label-lg,
      .section-title {
        color: var(--white);
      }

      main {
        display: flex;
        justify-content: center;
      }
    </style>
  </head>

  <body>
    <!--------------->
    <!-- PRELOADER -->
    <!--------------->
    <div class="preloader" data-preloader>
      <div class="preloader-circle"></div>
    </div>

    <!-------------->
    <!-- TEMPLATE -->
    <!-------------->
    <div id="header"></div>
    <main>
      <section class="section photography container has-anchor">
        <h2 class="section-title headline-md text-center">MY PHOTOS</h2>

        <div id="photo-grid"></div>
      </section>
    </main>
    <div id="footer"></div>

    <script>
      // Fetch the list of images to exclude
      fetch("./assets/images/instagram/exclude.json")
        .then((response) => response.json())
        .then((excludeList) => {

          // Fetch the Instagram data
          return fetch("./assets/images/instagram/instagram.json")
            .then((response) => response.json())
            .then((data) => {
              // Remove hashtags from captions and filter excluded images
              const filteredData = data
                .map((item) => {
                  if (item.caption) {
                    item.caption = item.caption.split("#")[0].trim();
                  }

                  item.images = item.images.filter((image) => {
                    return !excludeList.includes(image);
                  });

                  return item;
                });

              context.posts = filteredData;
              context.postsRoot = 'instagram/';

              console.log(filteredData);

              context.activePage = "photography";
              const h = loadTemplate("header.hbs", context, "header");
              const f = loadTemplate("footer.hbs", context, "footer");
              const p = loadTemplate("photo-grid.hbs", context, "photo-grid");

              Promise.all([h, f, p]).then(() => {
                main();
                setActive("photoLink");
              });
            });
        });
    </script>

    <!-- Ionicon -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  </body>
</html>
