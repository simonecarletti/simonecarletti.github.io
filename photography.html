<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta tags -->
    <title>Simone Carletti - Computer Engineer</title>
    <meta name="title" content="Simone Carletti - Computer Engineer" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="./assets/images/favicon.png" type="image/png" />

    <!-- Gogle font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet" />

    <!-- Include Handlebars -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
    <script src="./assets/js/handlebar-init.js"></script>
    <script src="./assets/js/main.js"></script>
    <script src="./assets/js/context.js"></script>

    <!-- Custom css link -->
    <link rel="stylesheet" href="./assets/css/require.css" />
    <link rel="stylesheet" href="./assets/css/main.css" />

    <style>
      main {
        display: flex;
        justify-content: center;
      }
    </style>
  </head>

  <body onresize="setIframeStyle()">
    <!--------------->
    <!-- PRELOADER -->
    <!--------------->
    <div class="preloader" data-preloader>
      <div class="preloader-circle"></div>
    </div>

    <!-------------->
    <!-- TEMPLATE -->
    <!-------------->
    <div id="header"></div>
    <main>
      <section class="section photography has-anchor">
        <div id="photo-grid"></div>
      </section>
    </main>
    <div id="footer"></div>

    <script>
    let instagramData = [];
    fetch('./assets/images/instagram/instagram.json')
      .then(response => response.json())
      .then(data => {
        instagramData = data;
        console.log('Instagram data loaded:', instagramData);
        context.instagramPosts = instagramData;
      })
      .catch(error => {
        console.error('Error loading instagram.json:', error);
      });

      context.activePage = "photography";
      const h = loadTemplate("header.hbs", context, "header");
      const f = loadTemplate("footer.hbs", context, "footer");
      const p = loadTemplate("photo-grid.hbs", context, "photo-grid");

      Promise.all([h, f]).then(() => {
        main();
        setActive("photoLink");
      });
    </script>

    <!-- Ionicon -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  </body>
</html>
